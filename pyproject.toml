[tool.uv.sources]
# barndoor is published only via git. Pinned to a post-Keycloak-migration commit:
# older commits (e.g. 4decc26) hardcode the Auth0 /oauth/token path and 404 against
# barndoor's current Keycloak IdP. This commit uses OIDC discovery for the token endpoint.
barndoor = { git = "https://github.com/barndoor-ai/barndoor-sdk.git", rev = "7d804d63df9ef7e9be52c321bb8ee415d02d1a5d" }
